[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kemerovo-city-photo"
version = "0.1.0"
description = "Offline urban photo assessment with local Ollama"
requires-python = ">=3.11"
dependencies = ["Pillow==12.0.0", "pydantic==2.12.3", "PyYAML==6.0.3", "shapely==2.1.2", "pyproj==3.7.2", "tzdata==2025.2"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]
heif = ["pillow-heif==1.1.1"]

[project.scripts]
city-photo = "city_photo.cli:main"

[tool.setuptools.packages.find]
include = ["city_photo*"]

[tool.setuptools.package-data]
city_photo = ["resources/*.yaml", "resources/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
