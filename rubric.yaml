version: '1'
status: initial_hypothesis_requires_human_calibration
anchors:
  0: Дефектов нет при достаточной различимости показанной части.
  1: Один едва заметный локальный дефект.
  2: Единичные небольшие отчётливые дефекты.
  3: Несколько небольших дефектов, в основном сохранная поверхность.
  4: Несколько заметных повреждений, сохранная часть преобладает.
  5: Выраженные дефекты на существенной видимой части.
  6: Много выраженных повреждений с сохранными участками.
  7: Повреждения доминируют, состояние сильно ухудшено.
  8: Сильные повреждения почти повсеместны, отдельные сохранные участки.
  9: Почти вся видимая часть сильно повреждена.
  10: Видимая часть практически полностью разрушена или максимально засорена/исписана.
abundance_anchors:
  0: Только крайне скудные, едва представленные деревья/кустарники, но объект виден.
  1: Единственный небольшой элемент древесной растительности.
  2: Немного отдельных небольших деревьев/кустов.
  3: Несколько разрозненных деревьев/кустов.
  4: Умеренно редкие деревья/кусты в нескольких частях кадра.
  5: Умеренная представленность деревьев/кустов.
  6: Хорошо представленная древесная растительность.
  7: Много деревьев/кустов в значительной части кадра.
  8: Обильная древесная растительность доминирует во многих частях кадра.
  9: Очень обильная древесная растительность почти по всему кадру.
  10: Максимально обильная, визуально доминирующая древесная растительность.
indicators:
  road_damage: Ямы, трещины, выбоины, просадки; на грунте колеи/размывы. Лужи и заплатки сами по себе не дефекты.
  sidewalk_damage: Трещины, провалы, сколы плитки, разрушение видимого покрытия пешеходной дорожки.
  wall_damage: Отслоение отделки, осыпание, видимые трещины; без инженерных выводов.
  wall_graffiti: Нежелательные надписи и теги; масштаб выраженности от единичной отметки до исписанной стены; мурал исключён.
  grass_damage: Вытоптанность, неорганизованные тропы, оголение, колеи в распознаваемом газоне; сезонность не дефект.
  curb_damage: Сколы, выпадение секций, разрушение и смещение; не предполагать нормативную необходимость бордюра.
  vegetation_abundance: Качественная видимая представленность деревьев и кустов; не процент озеленения двора. Отсутствие объекта даёт null.
  vegetation_damage: Только различимые сломанные ветви, повреждения ствола; отсутствие листьев не признак гибели.
  playground_damage: Поломки оборудования и разрушение покрытия; не сертификация безопасности.
  parking_damage: Повреждения видимого покрытия; занятость и количество автомобилей не учитываются.
  litter: Видимый бытовой мусор, от единичных предметов до массового засорения; листья/снег не мусор.
